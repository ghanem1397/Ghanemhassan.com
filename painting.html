<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title id="pageTitle">Painting — Ghanem Hassan</title>
  <meta name="description" content="Original painting by Ghanem Hassan. Mixed media on canvas with diamonds and emeralds."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <nav class="nav" id="nav">
    <a href="index.html" class="nav__logo">GHANEM HASSAN</a>
    <button class="nav__toggle" id="navToggle" aria-label="Menu"><span></span><span></span></button>
    <ul class="nav__links" id="navLinks">
      <li><a href="works.html">Works</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="evolution.html">Artist Evolution</a></li>
      <li><a href="exhibitions.html">Exhibitions</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox__close" id="lbClose">✕</button>
    <button class="lightbox__prev" id="lbPrev">‹</button>
    <button class="lightbox__next" id="lbNext">›</button>
    <div class="lightbox__img-wrap"><img id="lbImg" src="" alt=""/></div>
    <p class="lightbox__counter" id="lbCounter"></p>
  </div>

  <div id="paintingPage"></div>

  <section class="related-works">
    <div style="padding:0 3rem 2rem;">
      <p class="section-label">Continue Exploring</p>
      <h2 class="section-title">More Works</h2>
    </div>
    <div class="works-catalog" id="relatedGrid" style="padding-top:0;"></div>
  </section>

  <footer class="footer">
    <div class="footer__inner">
      <div class="footer__brand"><p class="footer__name">GHANEM HASSAN</p><p class="footer__tagline">Contemporary Artist · Milan</p></div>
      <div class="footer__links">
        <a href="works.html">Works</a><a href="about.html">About</a>
        <a href="exhibitions.html">Exhibitions</a><a href="contact.html">Contact</a>
        <a href="https://instagram.com/ghanemhassan_" target="_blank" rel="noopener">@ghanemhassan_</a>
      </div>
      <p class="footer__copy">© 2025 Ghanem Hassan · ghanemhassan.com</p>
    </div>
  </footer>

  <script src="js/paintings.js"></script>
  <script src="js/main.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const painting = PAINTINGS.find(p => p.slug === slug) || PAINTINGS[0];
    const allImgs = [painting.main, ...(painting.extras||[])].filter(Boolean);
    const sold = painting.sold || false;

    document.getElementById('pageTitle').textContent = painting.name + ' — Ghanem Hassan';

    // Price display
    const priceHTML = sold
      ? `<p class="pd-sold-note">This work is in a private collection.</p>`
      : painting.price_eur
        ? `<div class="pd-price-row"><span class="pd-price-label">Price</span><span class="pd-price">€${painting.price_eur.toLocaleString()}</span></div><p class="pd-price-note">Price excludes shipping and insurance. Installment plans available — enquire directly.</p>`
        : `<div class="pd-price-row"><span class="pd-price-label">Price</span><span class="pd-price">On request</span></div>`;

    document.getElementById('paintingPage').innerHTML = `
      <div class="pd-breadcrumb"><a href="works.html">← All Works</a></div>
      <div class="pd-layout">

        <!-- LEFT: Gallery -->
        <div class="pd-gallery">
          <div class="pd-main-img" id="pdMainImg">
            <img src="${allImgs[0]||''}" alt="${painting.name}" id="pdImg"/>
            <button class="pd-zoom-btn" onclick="openLightbox(currentIdx)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
          </div>
          ${allImgs.length > 1 ? `
          <div class="pd-thumbs" id="pdThumbs">
            ${allImgs.map((img,i) => `
              <button class="pd-thumb ${i===0?'active':''}" onclick="switchImg(${i})">
                <img src="${img}" alt="View ${i+1}" loading="lazy"/>
              </button>`).join('')}
          </div>` : ''}
        </div>

        <!-- RIGHT: Info -->
        <div class="pd-info">
          <div class="pd-status-row">
            <span class="status ${sold?'sold':'available'}">${sold?'Sold':'Available'}</span>
            ${painting.year ? `<span class="pd-year">${painting.year}</span>` : ''}
          </div>

          <h1 class="pd-title">${painting.name}</h1>
          <p class="pd-medium">${painting.medium || 'Mixed media on canvas'}</p>

          ${painting.description ? `
          <div class="pd-divider"></div>
          <p class="pd-desc">${painting.description}</p>` : ''}

          <div class="pd-divider"></div>

          <!-- Specs -->
          <div class="pd-specs">
            ${painting.size ? `<div class="pd-spec"><span class="pd-spec-label">Dimensions</span><span class="pd-spec-val">${painting.size}</span></div>` : ''}
            <div class="pd-spec"><span class="pd-spec-label">Medium</span><span class="pd-spec-val">${painting.medium||'Mixed media on canvas'}</span></div>
            <div class="pd-spec"><span class="pd-spec-label">Artist</span><span class="pd-spec-val">Ghanem Hassan</span></div>
            <div class="pd-spec"><span class="pd-spec-label">Studio</span><span class="pd-spec-val">Milan, Italy</span></div>
            ${painting.year ? `<div class="pd-spec"><span class="pd-spec-label">Year</span><span class="pd-spec-val">${painting.year}</span></div>` : ''}
            <div class="pd-spec"><span class="pd-spec-label">Provenance</span><span class="pd-spec-val">Direct from artist</span></div>
          </div>

          <div class="pd-divider"></div>

          <!-- Price + CTA -->
          ${priceHTML}

          ${!sold ? `
          <a href="contact.html?work=${encodeURIComponent(painting.name)}" class="btn btn--gold pd-cta">Inquire About This Work →</a>
          <a href="contact.html?type=commission" class="btn btn--outline pd-cta-sec">Request a Commission</a>
          ` : `
          <a href="contact.html?type=commission" class="btn btn--gold pd-cta">Request a Similar Commission →</a>
          `}

          <div class="pd-trust">
            <div class="pd-trust-item">
              <span class="pd-trust-icon">◆</span>
              <span>Certificate of authenticity included</span>
            </div>
            <div class="pd-trust-item">
              <span class="pd-trust-icon">◆</span>
              <span>Professional packing & worldwide shipping</span>
            </div>
            <div class="pd-trust-item">
              <span class="pd-trust-icon">◆</span>
              <span>Ghanem responds personally to every inquiry</span>
            </div>
          </div>
        </div>

      </div>
    `;

    // Gallery logic
    let currentIdx = 0;
    window.switchImg = function(i) {
      currentIdx = i;
      document.getElementById('pdImg').src = allImgs[i];
      document.querySelectorAll('.pd-thumb').forEach((t,j) => t.classList.toggle('active', j===i));
    };

    // Lightbox
    function openLightbox(i) {
      currentIdx = i;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
      updateLB();
    }
    function updateLB() {
      document.getElementById('lbImg').src = allImgs[currentIdx];
      document.getElementById('lbCounter').textContent = allImgs.length > 1 ? (currentIdx+1)+' / '+allImgs.length : '';
      document.getElementById('lbPrev').style.display = allImgs.length > 1 ? '' : 'none';
      document.getElementById('lbNext').style.display = allImgs.length > 1 ? '' : 'none';
    }
    document.getElementById('lbClose').onclick = () => { document.getElementById('lightbox').classList.remove('open'); document.body.style.overflow=''; };
    document.getElementById('lbPrev').onclick = () => { currentIdx=(currentIdx-1+allImgs.length)%allImgs.length; updateLB(); };
    document.getElementById('lbNext').onclick = () => { currentIdx=(currentIdx+1)%allImgs.length; updateLB(); };
    document.getElementById('lightbox').addEventListener('click', e => { if(e.target.id==='lightbox'){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';} });
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key==='Escape'){document.getElementById('lightbox').classList.remove('open');document.body.style.overflow='';}
      if (e.key==='ArrowLeft'){currentIdx=(currentIdx-1+allImgs.length)%allImgs.length;updateLB();}
      if (e.key==='ArrowRight'){currentIdx=(currentIdx+1)%allImgs.length;updateLB();}
    });

    // Related
    const related = PAINTINGS.filter(p=>p.slug!==slug&&p.main).sort(()=>0.5-Math.random()).slice(0,4);
    const rg = document.getElementById('relatedGrid');
    related.forEach(p => {
      rg.innerHTML += `<article class="wc-card"><a href="painting.html?slug=${p.slug}" class="wc-card__img-wrap ${p.sold?'wc-card__img-wrap--sold':''}"><img src="${p.main}" alt="${p.name}" loading="lazy"/><div class="wc-card__overlay"><span>View Work →</span></div>${p.sold?'<div class="wc-card__sold-badge">Sold</div>':''}</a><div class="wc-card__info"><div class="wc-card__top"><h3 class="wc-card__title">${p.name}</h3><span class="status ${p.sold?'sold':'available'}">${p.sold?'Sold':'Available'}</span></div><p class="wc-card__meta">${p.medium||'Mixed media on canvas'}</p><p class="wc-card__price ${p.sold?'wc-card__price--sold':''}">${p.sold?'In a private collection':p.price_eur?'€'+p.price_eur.toLocaleString():'Price on request'}</p><a href="painting.html?slug=${p.slug}" class="btn btn--gold btn--sm">View →</a></div></article>`;
    });
  </script>
</body>
</html>
